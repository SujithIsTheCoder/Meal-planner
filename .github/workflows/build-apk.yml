name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#c4623f' --iconBackgroundColorDark '#c4623f' --splashBackgroundColor '#fbf5e9' --splashBackgroundColorDark '#fbf5e9' || true
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meal-planner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
